[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "signal-observatory"
version = "0.1.0"
description = "Long-running, reproducible technology ecosystem observations"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
  "alembic==1.19.1",
  "fastapi==0.141.1",
  "pydantic==2.13.4",
  "pydantic-settings==2.15.0",
  "psycopg[binary]==3.3.4",
  "PyYAML==6.0.3",
  "sqlalchemy==2.0.51",
  "structlog==26.1.0",
  "typer==0.27.1",
  "uvicorn==0.52.1",
]

[project.optional-dependencies]
dev = [
  "httpx==0.28.1",
  "mypy==2.3.0",
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "ruff==0.16.2",
  "types-PyYAML==6.0.12.20260724",
]

[project.scripts]
signal-api = "signal_observatory_api.main:run"
signal-observatory = "signal_observatory_cli.main:main"
signal-worker = "signal_observatory_worker.main:run"

[tool.setuptools.packages.find]
where = [
  "apps/api/src",
  "apps/cli/src",
  "apps/worker/src",
  "packages/collector-core/src",
  "packages/analytics/src",
  "packages/entity-resolution/src",
  "packages/topic-registry/src",
  "collectors/arxiv/src",
  "collectors/github/src",
  "config/src",
  "db/src",
]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
markers = [
  "postgres: requires a running PostgreSQL instance",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = [
  "apps/api/src",
  "apps/cli/src",
  "apps/worker/src",
  "packages/collector-core/src",
  "packages/analytics/src",
  "packages/entity-resolution/src",
  "packages/topic-registry/src",
  "collectors/arxiv/src",
  "collectors/github/src",
  "config/src",
  "db/src",
  "tests",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "DTZ", "PT"]

[tool.ruff.lint.per-file-ignores]
"db/migrations/versions/*.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = [
  "apps/api/src",
  "apps/cli/src",
  "apps/worker/src",
  "packages/collector-core/src",
  "packages/analytics/src",
  "packages/entity-resolution/src",
  "packages/topic-registry/src",
  "collectors/arxiv/src",
  "collectors/github/src",
  "config/src",
  "db/src",
]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["alembic.*"]
ignore_missing_imports = true
