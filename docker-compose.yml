name: signal-observatory

services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: signal_observatory
      POSTGRES_USER: signal
      POSTGRES_PASSWORD: signal
      TZ: UTC
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U signal -d signal_observatory"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      SIGNAL_ENVIRONMENT: local
      SIGNAL_LOG_LEVEL: INFO
      SIGNAL_DATABASE_URL: postgresql+psycopg://signal:signal@db:5432/signal_observatory
      SIGNAL_RAW_DATA_PATH: /app/data/raw
      SIGNAL_BACKUP_PATH: /app/data/backups
      ARXIV_MIN_REQUEST_INTERVAL_SECONDS: "3.0"
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GITHUB_API_VERSION: ${GITHUB_API_VERSION:-2022-11-28}
      GITHUB_REQUIRE_AUTH: ${GITHUB_REQUIRE_AUTH:-true}
    command:
      - sh
      - -c
      - alembic upgrade head && uvicorn signal_observatory_api.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    volumes:
      - ./data/raw:/app/data/raw
      - ./data/backups:/app/data/backups
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    environment:
      SIGNAL_ENVIRONMENT: local
      SIGNAL_LOG_LEVEL: INFO
      SIGNAL_DATABASE_URL: postgresql+psycopg://signal:signal@db:5432/signal_observatory
      SIGNAL_RAW_DATA_PATH: /app/data/raw
      SIGNAL_WORKER_READY_FILE: /tmp/signal-worker-ready
      ARXIV_MIN_REQUEST_INTERVAL_SECONDS: "3.0"
      ARXIV_SCHEDULE: "0 2 * * *"
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GITHUB_API_VERSION: ${GITHUB_API_VERSION:-2022-11-28}
      GITHUB_REQUIRE_AUTH: ${GITHUB_REQUIRE_AUTH:-true}
      GITHUB_REQUEST_CONCURRENCY: ${GITHUB_REQUEST_CONCURRENCY:-1}
      GITHUB_DISCOVERY_PAGE_SIZE: ${GITHUB_DISCOVERY_PAGE_SIZE:-20}
      GITHUB_DISCOVERY_MAX_RESULTS_PER_MAPPING: ${GITHUB_DISCOVERY_MAX_RESULTS_PER_MAPPING:-20}
      GITHUB_MAX_REQUESTS_PER_RUN: ${GITHUB_MAX_REQUESTS_PER_RUN:-100}
      GITHUB_MIN_CORE_REMAINING: ${GITHUB_MIN_CORE_REMAINING:-100}
      GITHUB_MIN_SEARCH_REMAINING: ${GITHUB_MIN_SEARCH_REMAINING:-2}
      GITHUB_SNAPSHOT_SCHEDULE: "${GITHUB_SNAPSHOT_SCHEDULE:-30 2 * * *}"
      GITHUB_DISCOVERY_SCHEDULE: "${GITHUB_DISCOVERY_SCHEDULE:-0 3 * * 0}"
      GITHUB_CONDITIONAL_REQUESTS_ENABLED: ${GITHUB_CONDITIONAL_REQUESTS_ENABLED:-true}
    volumes:
      - ./data/raw:/app/data/raw
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "from pathlib import Path; assert Path('/tmp/signal-worker-ready').is_file()",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      VITE_API_BASE_URL: /api
      VITE_API_PROXY_TARGET: http://api:8000
    ports:
      - "5173:5173"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:5173').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

volumes:
  postgres_data:
