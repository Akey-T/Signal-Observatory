name: signal-observatory

services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: signal_observatory
      POSTGRES_USER: signal
      POSTGRES_PASSWORD: signal
      TZ: UTC
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U signal -d signal_observatory"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      SIGNAL_ENVIRONMENT: local
      SIGNAL_LOG_LEVEL: INFO
      SIGNAL_DATABASE_URL: postgresql+psycopg://signal:signal@db:5432/signal_observatory
      SIGNAL_RAW_DATA_PATH: /app/data/raw
    command:
      - sh
      - -c
      - alembic upgrade head && uvicorn signal_observatory_api.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    volumes:
      - ./data/raw:/app/data/raw
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    environment:
      SIGNAL_ENVIRONMENT: local
      SIGNAL_LOG_LEVEL: INFO
      SIGNAL_DATABASE_URL: postgresql+psycopg://signal:signal@db:5432/signal_observatory
      SIGNAL_RAW_DATA_PATH: /app/data/raw
      SIGNAL_WORKER_READY_FILE: /tmp/signal-worker-ready
    volumes:
      - ./data/raw:/app/data/raw
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "from pathlib import Path; assert Path('/tmp/signal-worker-ready').is_file()",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      VITE_API_BASE_URL: /api
      VITE_API_PROXY_TARGET: http://api:8000
    ports:
      - "5173:5173"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:5173').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

volumes:
  postgres_data:
