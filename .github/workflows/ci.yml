name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: signal_observatory_test
          POSTGRES_USER: signal
          POSTGRES_PASSWORD: signal
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U signal -d signal_observatory_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SIGNAL_ENVIRONMENT: test
      SIGNAL_DATABASE_URL: postgresql+psycopg://signal:signal@localhost:5432/signal_observatory_test
      TEST_DATABASE_URL: postgresql+psycopg://signal:signal@localhost:5432/signal_observatory_test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: python -m ruff check .
      - name: Check formatting
        run: python -m ruff format --check .
      - name: Type check
        run: python -m mypy apps packages config db
      - name: Apply PostgreSQL migrations
        run: alembic upgrade head
      - name: Test
        run: python -m pytest

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Check formatting
        run: npm run format:check
      - name: Type check
        run: npm run typecheck
      - name: Test
        run: npm run test
      - name: Build
        run: npm run build
